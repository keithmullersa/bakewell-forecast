name: Fetch observations

on:
  schedule:
    # Every 10 minutes so Skyshelter (typically sub-10-min updates) stays fresh.
    # BoM Cunderdin is also fetched on every run and stored as the backup block.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live observations
        run: python3 scripts/fetch_obs.py

      - name: Commit observations.json if the reading changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observations.json
          if git diff --cached --quiet; then
            echo "No observation change"
            exit 0
          fi
          git commit -m "Update observations"
          git push
