<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muppet Forecast • Mount Bakewell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #121826;
    --surface-2: #1a2235;
    --border: #2a3550;
    --text: #e8eef9;
    --text-muted: #8b9bb4;
    --accent: #00d4aa;
    --accent-2: #3b82f6;
    --warning: #f59e0b;
    --danger: #ef4444;
    --good: #10b981;
    --magic: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }
  header.page-header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    background: linear-gradient(180deg, rgba(0,212,170,0.08) 0%, transparent 100%);
  }
  header.page-header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header.page-header .subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 0.4rem; line-height: 1.35; max-width: 26rem; margin-left: auto; margin-right: auto; }
  .badge {
    display: inline-block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 0.75rem;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    margin: 0.25rem 0.2rem 0;
  }
  .badge-wrap {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    margin: 0.25rem 0.2rem 0;
    vertical-align: middle;
  }
  .badge-wrap .badge { margin: 0; }
  .section-heading {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.4rem 0.45rem;
    margin-bottom: 0.7rem;
  }
  .section-heading h2 { margin: 0; font-size: 1.3rem; }
  .footer-lines {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
  }
  .footer-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.45rem 0.85rem;
  }
  .footer-item {
    display: inline-flex;
    align-items: center;
    gap: 0.22rem;
  }
  .footer-item .info { margin: 0; }
  .footer-sep { color: var(--text-muted); }
  .footer-snapshot { color: var(--text-muted); }
  footer .badge-wrap { margin: 0; }
  .stat-card .label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
  }
  .stat-card .label .info-btn,
  .chip .info-btn,
  .badge-wrap .info-btn { width: 1.05rem; height: 1.05rem; font-size: 0.7rem; text-transform: none; letter-spacing: 0; }
  .status { text-align: center; margin: 1rem 0; color: var(--text-muted); font-size: 0.9rem; }
  .status.error { color: var(--danger); }
  .status.success { color: var(--good); }
  .now-section {
    margin: 0 0 2rem;
    padding: 1.15rem 1.2rem 1.3rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
  }
  .now-section h2 {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.45rem;
  }
  .now-blurb { color: var(--text-muted); font-size: 0.95rem; max-width: 70ch; margin-bottom: 1rem; }
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
  }
  .stat-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.85rem 0.7rem;
    text-align: center;
  }
  .stat-card .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-card .value { font-size: 1.35rem; font-weight: 600; margin-top: 0.25rem; color: var(--accent); }
  .stat-card .value.good { color: var(--good); }
  .stat-card .value.warn { color: var(--warning); }
  .stat-card .value.bad { color: var(--danger); }
  .stat-card .unit { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
  .stat-card .estimate { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; }
  .stat-card .value:has(.wind-arrow) {
    color: inherit;
    line-height: 0;
    font-size: 0;
    margin-top: 0.35rem;
  }
  .wind-arrow {
    display: block;
    width: 2.55rem;
    height: 2.55rem;
    margin: 0 auto;
    color: var(--text);
    transform-origin: 50% 50%;
    overflow: visible;
  }
  .wind-arrow.is-launch { color: var(--good); }
  .stat-card .wind-dir-caption {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    margin-top: 0.28rem;
    letter-spacing: 0.02em;
  }
  .forecast-days { margin-top: 0.5rem; }
  .day-section {
    margin: 0 0 1.75rem;
    padding: 0 0.6rem 1.1rem;
    border-radius: 20px;
    border: 1px solid rgba(42,53,80,0.55);
  }
  .day-section.tint-0 { background: rgba(0, 212, 170, 0.045); }
  .day-section.tint-1 { background: rgba(59, 130, 246, 0.05); }
  .day-section.tint-2 { background: rgba(168, 85, 247, 0.05); }
  .day-section.tint-3 { background: rgba(245, 158, 11, 0.045); }
  .day-header {
    position: sticky;
    top: 0;
    z-index: 8;
    padding: 0.85rem 0.35rem 0.65rem;
    background: linear-gradient(180deg, rgba(10,14,23,0.97) 0%, rgba(18,24,38,0.94) 70%, rgba(18,24,38,0.88) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .day-header h2 { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em; }
  .day-rule {
    height: 2px;
    margin: 0.45rem 0 0.65rem;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 40%, transparent 90%);
    opacity: 0.85;
  }
  .day-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.75rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    color: var(--text-muted);
  }
  .chip strong { color: var(--text); font-weight: 600; }
  .chip.magic strong { color: var(--magic); }
  .chip.good strong { color: var(--good); }
  .chip.bad {
    border-color: rgba(239, 68, 68, 0.45);
    color: var(--danger);
  }
  .chip.bad strong { color: var(--danger); }
  .chip.muted strong { color: var(--text-muted); font-weight: 550; }
  .forecast-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 0.85rem;
    margin-top: 0.7rem;
  }
  .forecast-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem 1.05rem 1.05rem;
  }
  .forecast-card h3 {
    font-size: 0.95rem;
    margin-bottom: 0.7rem;
    color: var(--accent);
    font-weight: 600;
  }
  .forecast-card .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    font-size: 0.84rem;
    margin: 0.32rem 0;
    border-bottom: 1px solid rgba(42,53,80,0.5);
    padding-bottom: 0.28rem;
  }
  .forecast-card .row span:first-child { color: var(--text-muted); }
  .forecast-card .row span:last-child { font-weight: 500; text-align: right; }
  .site-val { display: block; font-size: 0.7rem; font-weight: 400; color: var(--text-muted); }
  .good { color: var(--good); }
  .warn { color: var(--warning); }
  .bad { color: var(--danger); }
  footer {
    text-align: center;
    margin-top: 3rem;
    padding: 1.5rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }

  .flyable-summary {
    margin: 1.15rem 0 1rem;
    padding: 1.05rem 1.2rem 1.15rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
  }
  .flyable-heading {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.55rem;
  }
  .flyable-summary h3 {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0;
  }
  .info {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
  }
  .info-btn {
    width: 1.2rem;
    height: 1.2rem;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .info-btn:hover, .info-btn:focus-visible, .info.is-open .info-btn {
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }
  .info-pop {
    display: none;
    position: fixed;
    z-index: 10000;
    width: max-content;
    max-width: calc(100vw - 16px);
    padding: 0.7rem 0.85rem;
    background: #1a2235;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    color: var(--text);
    font-size: 0.8rem;
    font-weight: 400;
    font-style: normal;
    letter-spacing: normal;
    text-transform: none;
    line-height: 1.45;
    pointer-events: auto;
    white-space: pre-wrap;
  }
  .info-pop.is-visible { display: block !important; }
  .info-pop::before {
    content: "";
    position: absolute;
    top: -6px;
    left: var(--caret-left, 8px);
    width: 10px;
    height: 10px;
    background: #1a2235;
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    transform: rotate(45deg);
  }
  .info-pop.info-pop-above::before {
    top: auto;
    bottom: -6px;
    border-left: none;
    border-top: none;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .flyable-summary, .flyable-heading, .day-header, .day-chips, .chip, .section-heading, .badge-wrap, .stat-card, .now-section, .footer-infos, .footer-row, .overview, .now-kicker, .now-divider {
    overflow: visible;
  }
  .chip .magic-pct { color: var(--magic); font-weight: 600; }
  .fly-chip .fly-best { color: var(--magic); font-weight: 600; white-space: nowrap; }
  .flyable-days {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 0.4rem;
  }
  .fly-chip {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.1rem 0.28rem;
    text-decoration: none;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.5rem 0.75rem;
    font-size: 0.84rem;
    line-height: 1.35;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .fly-chip:hover, .fly-chip:focus-visible {
    border-color: var(--accent);
    background: rgba(0,212,170,0.08);
    outline: none;
  }
  .fly-chip .fly-day { font-weight: 600; color: var(--text); white-space: nowrap; }
  .fly-chip .fly-sep { color: var(--text-muted); font-weight: 400; }
  .fly-chip .fly-hours { color: var(--good); font-weight: 600; white-space: nowrap; }
  .fly-chip .fly-magic { color: var(--magic); font-weight: 600; }
  .fly-chip .fly-xc { color: var(--text); font-weight: 500; white-space: nowrap; }
  .fly-chip.good { border-color: rgba(16, 185, 129, 0.4); }
  .fly-chip.bad { border-color: rgba(239, 68, 68, 0.35); }
  .fly-chip.bad .fly-closed { color: var(--danger); }
  .day-section { scroll-margin-top: 0.6rem; }
  .site-coverage { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 0.9rem; max-width: 72ch; }
  html { -webkit-text-size-adjust: 100%; }
  body { overflow-x: hidden; }
  .forecast-card .row span { overflow-wrap: anywhere; }


  .now-kicker,
  .now-divider {
    grid-column: 1 / -1;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1.3;
  }
  .now-kicker {
    margin: 0 0 -0.15rem;
    padding: 0 0.1rem;
    text-align: left;
  }
  .now-divider {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin: 0.15rem 0 0.05rem;
  }
  .now-divider::before,
  .now-divider::after {
    content: "";
    flex: 1 1 0.7rem;
    min-width: 0.5rem;
    height: 1px;
    background: var(--border);
  }
  .now-divider span {
    flex: 0 1 auto;
    text-align: center;
  }
  .overview .obs-card { grid-column: 1 / -1; text-align: center; padding: 0.85rem 0.75rem 0.8rem; }
  .obs-card .obs-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-bottom: 0.55rem;
  }
  .obs-card .obs-head .label { text-transform: uppercase; }
  .obs-metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.35rem 0.3rem;
    align-items: start;
  }
  .obs-metric .value { font-size: 1.2rem; margin-top: 0.1rem; }
  .obs-metric .value:has(.wind-arrow) {
    color: inherit;
    line-height: 0;
    font-size: 0;
    margin-top: 0.15rem;
  }
  .obs-metric .wind-arrow { width: 2.15rem; height: 2.15rem; }
  .obs-metric .estimate { margin-top: 0.1rem; }
  .obs-meta {
    margin-top: 0.28rem;
    font-size: 0.68rem;
    line-height: 1.4;
    color: var(--text-muted);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .obs-note {
    margin: -0.2rem 0 0.45rem;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--warning);
    text-transform: none;
    letter-spacing: 0;
  }
  .obs-card.is-stale { opacity: 0.78; }
  .obs-card.is-stale .value,
  .obs-card.is-stale .wind-arrow,
  .obs-card.is-stale .wind-dir-caption { color: var(--text-muted); }
  .obs-status {
    margin-top: 0.35rem;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--warning);
    text-transform: none;
    letter-spacing: 0;
  }
  .obs-card.is-stale .obs-status { color: var(--text-muted); }
  .info-pop a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .info-pop a:hover { color: #fff; }
  @media (max-width: 700px) {
    header.page-header h1 { font-size: 1.7rem; }
    .forecast-grid { grid-template-columns: 1fr; }
    /* phone layout (~360-430px wide, incl. the Android app) */
    .container { padding: 0.7rem 0.75rem 1rem; }
    header.page-header { padding: 1.2rem 0.4rem 0.6rem; }
    header.page-header .subtitle { font-size: 0.82rem; line-height: 1.35; padding: 0 0.2rem; }
    .flyable-summary { margin: 0.85rem 0 0.85rem; padding: 0.9rem 0.8rem 0.95rem; border-radius: 16px; }
    .now-section { margin: 0 0 1.4rem; padding: 0.95rem 0.8rem 1rem; border-radius: 16px; }
    .now-blurb { font-size: 0.92rem; }
    .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; }
    .now-kicker, .now-divider { font-size: 0.64rem; letter-spacing: 0.07em; }
    .now-divider span { line-height: 1.35; }
    .stat-card { padding: 0.7rem 0.5rem; border-radius: 12px; }
    .stat-card .value { font-size: 1.2rem; }
    .obs-card { padding: 0.75rem 0.55rem 0.7rem; }
    .obs-metric .value { font-size: 1.08rem; }
    .obs-metric .wind-arrow { width: 1.95rem; height: 1.95rem; }
    .obs-meta, .obs-note { font-size: 0.64rem; }
    .day-section { padding: 0 0.45rem 0.85rem; margin-bottom: 1.3rem; border-radius: 16px; }
    .day-header { padding: 0.7rem 0.25rem 0.55rem; }
    .forecast-card { padding: 0.85rem 0.85rem 0.9rem; border-radius: 14px; }
    .forecast-card .row { font-size: 0.88rem; }
    footer { margin-top: 2rem; padding: 1.2rem 0.4rem; }
    .section-heading h2 { font-size: 1.15rem; }
    .flyable-days { grid-template-columns: 1fr; }
    .fly-chip { padding: 0.48rem 0.7rem; font-size: 0.82rem; border-radius: 11px; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="page-header">
    <h1>Muppet Forecast</h1>
    <p class="subtitle" id="site-subtitle">Mount Bakewell, WA · Paragliding · launch 432 m AMSL</p>
  </header>

  <div class="status" id="status">Loading live forecast…</div>

  <section class="flyable-summary" id="flyable-summary" hidden>
    <div class="flyable-heading">
      <h3>Flyable days</h3>
      <span class="info">
        <button type="button" class="info-btn" aria-label="What makes a day flyable" aria-expanded="false">i</button>
        <span class="info-pop" role="tooltip" hidden>A day is flyable if at least one 11:00–17:00 slot is launchable (E–SSW, 5–28 km/h).</span>
      </span>
    </div>
    <div class="flyable-days" id="flyable-days"></div>
  </section>

  <section class="now-section" id="now-section" hidden>
    <h2 id="now-title">Now at Mount Bakewell</h2>
    <p class="now-blurb" id="now-blurb"></p>
    <div class="overview" id="overview"></div>
  </section>

  <div class="forecast-days">
    <div class="section-heading">
      <h2>Soaring-hour forecast</h2>
      <span id="soaring-forecast-info"></span>
    </div>
    <div id="forecasts"></div>
  </div>

  <footer>
    <div class="footer-lines">
      <div class="footer-line">
        <span class="footer-item">
          <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a><span id="footer-om-info"></span>
        </span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span class="footer-item">
          <a href="https://wamuppet.itwolf.net" target="_blank" rel="noopener">wamuppet.itwolf.net</a><span id="footer-wamuppet-info"></span>
        </span>
      </div>
      <div class="footer-line">
        <span class="footer-item badge-wrap" id="version-wrap">
          <span class="badge" id="version-badge">Formula</span>
        </span>
        <span class="footer-item" id="footer-estimates-info"></span>
        <span class="footer-item" id="footer-page-info"></span>
      </div>
      <div class="footer-line footer-snapshot" id="site-snapshot"></div>
    </div>
  </footer>

  if (tq == null || windKph == null) return [null, null];
  let F = p.xc_f_intercept + p.xc_f_slope * windKph;
  let G = Math.max(0, p.xc_g_intercept - p.xc_g_slope * windKph);
  const low = p.xc_th_low_ref_m ? Math.min(1, (th || 0) / p.xc_th_low_ref_m) : 1;
  let high = 1;
  if ((th || 0) >= p.xc_th_very_high_m) high = p.xc_th_very_high;
  else if ((th || 0) >= p.xc_th_high_start_m) high = p.xc_th_high_mid;
  const scale = (tq/100) * low * high;
  return [Math.round(scale * F * 100)/100, Math.round(scale * G * 100)/100];
}

function blendLaunchWind(w10, d10, w80, d80, w80Wt) {
  if (w80 == null || w80Wt <= 0) return [w10, d10];
  if (w10 == null) return [w80, d80];
  const w1 = 1 - w80Wt;
  const spd = w1 * w10 + w80Wt * w80;
  let deg = d10 != null ? d10 : d80;
  if (d10 != null && d80 != null) {
    const r = Math.PI / 180;
    const ub = w1 * w10 * Math.sin(d10 * r) + w80Wt * w80 * Math.sin(d80 * r);
    const vb = w1 * w10 * Math.cos(d10 * r) + w80Wt * w80 * Math.cos(d80 * r);
    if (ub || vb) deg = ((Math.atan2(ub, vb) * 180 / Math.PI) + 360) % 360;
  }
  return [spd, deg];
}
function estimateGustKph(windLaunch, windLaunchQ, gustOm, ws, p) {
  const cands = [];
  if (gustOm != null) cands.push(gustOm);
  if (windLaunch != null) {
    const mech = (p.gust_mech_factor ?? 1.10) * windLaunch;
    const conv = (p.gust_wstar_factor ?? 2.5) * (ws != null && ws > 0 ? ws : 0);
    const base = (p.gust_base_add_kph ?? 2.0);
    cands.push(mech + conv + base);
  }
  if (!cands.length) return null;
  let gQ = quantizeKph(Math.max(...cands));
  if (gQ != null && windLaunchQ != null && gQ < windLaunchQ) gQ = windLaunchQ;
  return gQ;
}
function estimateHour(hour, localHour) {
  const p = FORMULAS.params, loc = FORMULAS.location;
  const elev = loc.elev_m;
  const t2 = hour.temperature_2m;
  const blh = hour.boundary_layer_height;
  const w80Wt = p.launch_wind_80m_weight ?? 0.5;
  const [wind, dirDeg] = blendLaunchWind(hour.wind_speed_10m, hour.wind_direction_10m, hour.wind_speed_80m, hour.wind_direction_80m, w80Wt);
  const dir = degToDir(dirDeg);
  const windQ = quantizeKph(wind);
  const w850 = hour.wind_speed_850hPa;
  const d850 = hour.wind_direction_850hPa;
  const windAloftQ = quantizeKph(w850);
  const dirAloft = degToDir(d850);
  const th = thermalHeight(blh, p);
  const [ws] = wStar(blh, hour.sensible_heat_flux, t2, hour.shortwave_radiation, p);
  const upd = updraftMs(ws, p);
  const tq = thermalQuality(upd, windQ != null ? windQ : wind, localHour, p);
  const launch = isLaunchable(dir, windQ != null ? windQ : wind, loc);
  // Invariant: Magic % is never > 0 when the slot is not launchable.
  const magic = launch.ok ? magicPct(dir, windQ != null ? windQ : wind, localHour, loc, p) : 0;
  const turbL = turbulenceCategory(windQ != null ? windQ : wind);
  const turbA = turbulenceCategory(windAloftQ != null ? windAloftQ : w850);
  const shearV = vectorShear(wind, dirDeg, w850, d850);
  const [dw, tri] = xcDistances(tq, windQ != null ? windQ : wind, th, p);
  const zTop = th == null ? null : elev + th;
  const tTop = interpolateTemperature(levelsFromHour(hour, elev), zTop);
  const gustQ = estimateGustKph(wind, windQ, hour.wind_gusts_10m, ws, p);
  return {
    temp_launch_c: t2,
    temp_launch_c_display: t2 == null ? null : Math.round(t2),
    temp_thermal_top_c: tTop == null ? null : Math.round(tTop*10)/10,
    thermal_top_amsl_m: zTop == null ? null : Math.round(zTop),
    wind_launch_kph: windQ,
    wind_launch_kph_raw: wind,
    wind_launch_dir: dir,
    wind_launch_dir_deg: (dirDeg == null || Number.isNaN(Number(dirDeg))) ? null : Math.round(((Number(dirDeg) % 360) + 360) % 360) % 360,
    wind_gust_kph: gustQ,
    wind_aloft_kph: windAloftQ,
    wind_aloft_dir: dirAloft,
    thermal_height_m: th == null ? null : Math.round(th),
    updraft_ms: upd == null ? null : Math.round(upd*100)/100,
    thermal_quality_pct: tq,
    launchable: launch.ok,
    launchable_reason: launch.reason,
    magic_pct: magic,
    turbulence_launch: turbL,
    turbulence_launch_phrase: turbulencePhrase(turbL),
    turbulence_aloft: turbA,
    turbulence_aloft_phrase: turbulencePhrase(turbA),
    shear: shearCategory(shearV, p),
    xc_downwind_km: dw,
    xc_triangle_km: tri
  };
}

function conditionsSentence(est) {
  const wind = est.wind_launch_kph, wdir = est.wind_launch_dir || 'unknown';
  const windBit = wind != null ? `Wind at launch is ${wdir} ${wind} km/h` : 'Wind at launch is unavailable';
  let s1;
  if (est.launchable) s1 = `${windBit}, in the E–SSW window (5–28 km/h), so the launch is open.`;
  else {
    const why = est.launchable_reason ? est.launchable_reason.charAt(0).toLowerCase() + est.launchable_reason.slice(1) : 'conditions are off';
    s1 = `${windBit}, so it is not launchable: ${why}.`;
  }
  const upd = est.updraft_ms, th = est.thermal_height_m;
  let therm;
  if (upd == null || upd < 0.6 || !th) therm = 'Thermals are weak or shut down';
  else if (upd >= 2.5 && th >= 1400) therm = `Thermals look strong (about ${upd.toFixed(1)} m/s, top near ${th} m)`;
  else if (upd >= 1.8 && th >= 900) therm = `Thermals are usable (about ${upd.toFixed(1)} m/s, top near ${th} m)`;
  else therm = `Thermals are modest (about ${upd.toFixed(1)} m/s, top near ${th} m)`;
  const turbWords = {none:'the air looks smooth', light:'expect light turbulence', rough:'expect rough air', dangerous:'turbulence looks dangerous', unknown:'turbulence is unclear'}[est.turbulence_launch] || 'turbulence is unclear';
  let s2 = `${therm}, ${turbWords}.`;
  if (est.launchable && est.magic_pct) s2 += ` Magic chance ${est.magic_pct}%.`;
  else if (est.launchable) {
    s2 += (wdir === 'E' || wdir === 'ESE')
      ? ' Magic chance is 0% because the direction is not in the SE–SSW sweet spot.'
      : ' Magic chance is 0%.';
  }
  return `${s1} ${s2}`;
}

function mergeHourly(blobs) {
  const times = new Set();
  blobs.forEach(b => (b.hourly && b.hourly.time || []).forEach(t => times.add(t)));
  const timeList = Array.from(times).sort();
  const hourly = { time: timeList };
  const keys = new Set();
  blobs.forEach(b => Object.keys((b && b.hourly) || {}).forEach(k => { if (k !== 'time') keys.add(k); }));
  const indexes = blobs.map(b => {
    const map = {};
    (b.hourly && b.hourly.time || []).forEach((t,i) => map[t] = i);
    return map;
  });
  for (const key of keys) {
    hourly[key] = timeList.map(t => {
      for (let i = 0; i < blobs.length; i++) {
        const arr = blobs[i].hourly && blobs[i].hourly[key];
        const j = indexes[i][t];
        if (arr && j != null && arr[j] != null) return arr[j];
      }
      return null;
    });
  }
  const meta = blobs.find(b => b.elevation != null) || blobs[0] || {};
  return { latitude: meta.latitude, longitude: meta.longitude, elevation: meta.elevation, timezone: meta.timezone, hourly };
}

function omUrl(base, vars, days) {
  return `${base}?latitude=${LAT}&longitude=${LON}&models=gfs_seamless&timezone=${encodeURIComponent(TZ)}&wind_speed_unit=kmh&forecast_days=${days}&hourly=${vars}`;
}

async function fetchGroup(vars, days) {
  const bases = [
    'https://api.open-meteo.com/v1/forecast',
    'https://previous-runs-api.open-meteo.com/v1/forecast'
  ];
  let lastErr;
  for (const base of bases) {
    try {
      const res = await fetch(omUrl(base, vars, days));
      const data = await res.json();
      if (!res.ok || data.error) { lastErr = data.reason || `HTTP ${res.status}`; continue; }
      if (data.hourly && data.hourly.time) return data;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error(lastErr || 'no data');
}

async function loadLiveForecast() {
  const days = 10;
  const blobs = [];
  const errors = [];
  for (const vars of VAR_GROUPS) {
    try { blobs.push(await fetchGroup(vars, days)); }
    catch (e) { errors.push(e.message); }
  }
  if (!blobs.length) throw new Error(errors[0] || 'Open-Meteo unavailable');
  return { forecast: mergeHourly(blobs), warnings: errors };
}

function hourMap(forecast) {
  const h = forecast.hourly || {};
  const map = {};
  (h.time || []).forEach((t, i) => {
    const row = { time: t };
    Object.keys(h).forEach(k => { if (k !== 'time') row[k] = h[k][i]; });
    map[t] = row;
  });
  return map;
}

function siteByKey() {
  const m = {};
  (SITE.slots || []).forEach(s => { if (s.slot_key) m[s.slot_key] = s; });
  return m;
}

function fmt(v, digits, unit) {
  if (v == null || Number.isNaN(v)) return '–';
  const n = typeof digits === 'number' ? Number(v).toFixed(digits) : v;
  return unit ? `${n}${unit}` : String(n);
}

function windClass(kph) {
  if (kph == null) return '';
  if (kph >= 32) return 'bad';
  if (kph >= 22) return 'warn';
  return 'good';
}
function turbClass(t) {
  if (t === 'dangerous' || t === 'rough') return t === 'dangerous' ? 'bad' : 'warn';
  if (t === 'none' || t === 'light') return 'good';
  return '';
}

function pair(label, ours, site, cls) {
  const siteBit = (site == null || site === '') ? '' : `<small class="site-val">site ${site}</small>`;

}

function tile(label, value, unit, note, valueClass) {
  const vcls = valueClass ? `value ${valueClass}` : 'value';

}

function launchableNowState(est) {
  if (!est || !est.launchable) return { text: 'No', cls: 'bad' };

  // Launchable max is 28 km/h, so the red >= 32 km/h band cannot appear on a Yes.
  const wc = windClass(est.wind_launch_kph);
  if (wc === 'warn' || wc === 'bad') return { text: 'Yes, strong', cls: 'warn' };
  return { text: 'Yes', cls: 'good' };
}

function launchElevM() {
  const loc = FORMULAS && FORMULAS.location;

function thAmslM(thAgl, precomputed) {
  if (precomputed != null) return precomputed;

  const elev = launchElevM();
  if (elev == null) return null;
  return Math.round(Number(thAgl) + elev);
}

function fmtThAmsl(thAgl, precomputed) {

  return v != null ? `${v} m AMSL` : '\u2013';
}

function launchableNowNote(est) {
  const dir = est.wind_launch_dir;
  const spd = est.wind_launch_kph;
  const hasWind = dir && spd != null;
  const wind = hasWind ? `${dir} ${spd} km/h` : (spd != null ? `${spd} km/h` : 'No wind data');
  if (est.launchable) return `${wind}, in range`;
  const r = est.launchable_reason || '';
  if (r === 'No data') return 'No wind data';
  if (r.startsWith('Direction') || r.includes('outside')) {
    return hasWind ? `${wind}, outside E\u2013SSW` : 'Direction outside E\u2013SSW';
  }
  if (r === 'Too light') return hasWind ? `${wind}, too light` : 'Too light';
  if (r === 'Too strong') return hasWind ? `${wind}, too strong` : 'Too strong';
  return r;
}

function launchableInfoText(est, lo, hi) {
  const defn = `A slot is launchable when the wind at launch is E\u2013SSW at ${lo}\u2013${hi} km/h \u2014 the same definition used for flyable days.`;
  const strong = ` When it is still in that window but the wind is 22 km/h or more, this tile reads Yes, strong in orange. That is the same threshold that turns Wind at launch orange on the soaring-hour cards: launchable, but on the strong side of the window. Above ${hi} km/h it is not launchable.`;
  if (est && est.launchable === false) {
    const why = launchableNowNote(est);
    return `${defn}${strong} Right now it is not launchable: ${why}.`;
  }
  const state = launchableNowState(est);
  if (state.cls === 'warn') {
    const why = launchableNowNote(est);
    return `${defn}${strong} Right now it is Yes, strong: ${why}.`;
  }
  return `${defn}${strong}`;
}

function launchDirDeg(est) {
  if (!est) return null;
  if (est.wind_launch_dir_deg != null && !Number.isNaN(Number(est.wind_launch_dir_deg))) {
    return Math.round(((Number(est.wind_launch_dir_deg) % 360) + 360) % 360) % 360;
  }
  const dir = est.wind_launch_dir;
  if (!dir) return null;
  const i = CARDINALS.indexOf(String(dir).toUpperCase());

}

const OBS_STALE_MIN = 90;
const OBS_INFO_HTML = 'The primary reading is from Skyshelter, an unofficial private weather station about 120 m south of the Mount Bakewell top launch (Weather Underground station IBURGE35). It sits on the hill near launch, but its exact mounting and sensor height are unverified, so treat this as a near-launch check rather than a calibrated launch instrument.\n\nIf Skyshelter is missing or more than 30 minutes old, we fall back to the Bureau of Meteorology automatic weather station at Cunderdin Airport, about 50 km ENE of launch and 215 m below it, with a standard 10 m mast. That is a rough regional check, not the wind at launch, and it updates about every 30 minutes.\n\nSkyshelter data is provided via Weather Underground. Fallback data \u00a9 <a href="https://www.bom.gov.au/copyright" target="_blank" rel="noopener noreferrer">Bureau of Meteorology</a>, used under the Bureau\u2019s non-commercial terms.';

function obsCardTitle(data) {

  if (data && data.source === 'bom_cunderdin') {

function fmtObsAge(ageMin) {
  if (ageMin == null || Number.isNaN(ageMin)) return '';
  const mins = Math.max(0, Math.round(ageMin));
  if (mins < 120) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  return `${hrs} h ago`;
}

function fmtObsClock(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return perthClock(d);
}

function fmtObsNumber(v, digits) {
  if (v == null || v === '' || Number.isNaN(Number(v))) return '\u2013';

}

async function loadObservations() {
  try {
    const res = await fetch(`./observations.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) return { missing: true, error: 'HTTP ' + res.status };
    const data = await res.json();
    if (!data || !data.obs_time_awst) return { missing: true, error: 'empty' };
    const t = new Date(data.obs_time_awst);
    if (Number.isNaN(t.getTime())) return { missing: true, error: 'bad time' };
    const ageMin = (Date.now() - t.getTime()) / 60000;
    return { data, ageMin, stale: ageMin > OBS_STALE_MIN, missing: false };
  } catch (e) {
    return { missing: true, error: (e && e.message) || 'fetch failed' };
  }
}

function observedNowCard(est, obs) {
  const data = (obs && !obs.missing && obs.data) ? obs.data : null;
  const info = infoButtonHtml('About the observed wind', OBS_INFO_HTML);
  const title = `<div class="obs-head"><div class="label">${obsCardTitle(data)}${info}</div></div>`;
  const note = (data && data.source === 'bom_cunderdin')
    ? '<div class="obs-note">Skyshelter unavailable</div>'
    : '';
  const missing = !data;
  const stale = !missing && obs.stale;
  const ageLabel = (!missing && obs.ageMin != null) ? fmtObsAge(obs.ageMin) : '';
  const clock = data ? fmtObsClock(data.obs_time_awst) : '';
  const prefix = obsMetaPrefix(data);

  if (missing || stale) {
    const status = stale
      ? `No recent reading${clock ? ` \u2014 last ${clock} AWST` : ''}${ageLabel ? ` (${ageLabel})` : ''}`
      : 'No recent reading';
    const metrics = data ? observedMetrics(data) : '';
    const meta = data && clock
      ? `<div class="obs-meta">${prefix} \u00b7 ${clock} AWST${ageLabel ? ` (${ageLabel})` : ''}</div>`
      : `<div class="obs-meta">${prefix}</div>`;
    return `<div class="stat-card obs-card is-stale">${title}${note}${metrics}<div class="obs-status">${status}</div>${meta}</div>`;
  }

  const meta = `<div class="obs-meta">${prefix} \u00b7 ${clock} AWST${ageLabel ? ` (${ageLabel})` : ''}</div>`;
  return `<div class="stat-card obs-card">${title}${note}${observedMetrics(data)}${meta}</div>`;
}

    const cls = 'wind-arrow' + (inWindow ? ' is-launch' : '');
    const aria = [dir, deg != null ? Math.round(deg) + ' degrees' : ''].filter(Boolean).join(' ');
    const svg = `<svg class="${cls}" viewBox="0 0 64 64" role="img" aria-label="${aria}" style="transform:rotate(${rot}deg)"><path fill="currentColor" d="M32 6 L46 30 L36 26 L36 58 L28 58 L28 26 L18 30 Z"/></svg>`;
    const caption = [dir, deg != null ? `${Math.round(deg)}\u00b0` : null].filter(Boolean).join(' ');
    dirCell = `<div class="obs-metric"><div class="value">${svg}</div><div class="estimate wind-dir-caption">${caption}</div></div>`;
  }
  return `<div class="obs-metrics">

      <div class="obs-metric"><div class="value">${fmtObsNumber(data.gust_kmh, 0)}<span class="unit"> km/h</span></div><div class="estimate">Gust</div></div>

      <div class="obs-metric"><div class="value">${data.temp_c == null || data.temp_c === '' ? '\u2013' : fmtObsNumber(data.temp_c, 1)}<span class="unit"> \u00b0C</span></div><div class="estimate">Temp</div></div>
    </div>`;
}

function dayDate(isoDate) {
  const [y,m,d] = isoDate.split('-').map(Number);
  // Noon UTC+8 so the weekday is stable
  return new Date(Date.UTC(y, m-1, d, 4, 0, 0));
}
function dayName(isoDate) {
  return new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'short' }).format(dayDate(isoDate));
}
function datePart(isoDate, type) {
  const parts = new Intl.DateTimeFormat('en-AU', {
    timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short'
  }).formatToParts(dayDate(isoDate));
  return (parts.find(p => p.type === type) || {}).value || '';
}
function shortDay(isoDate) {
  return `${datePart(isoDate, 'weekday')} ${datePart(isoDate, 'day')}`;
}
function shortDayMonth(isoDate) {
  return `${datePart(isoDate, 'weekday')} ${datePart(isoDate, 'day')} ${datePart(isoDate, 'month')}`;
}
function perthTodayISO() {
  const p = perthParts(new Date());
  return `${p.year}-${p.month}-${p.day}`;
}
function pickBestSlot(flyable) {
  if (!flyable.length) return null;
  return flyable.slice().sort((a,b) => {
    const am = a.est.magic_pct||0, bm = b.est.magic_pct||0;
    if (bm !== am) return bm - am;
    const at = a.est.thermal_quality_pct||0, bt = b.est.thermal_quality_pct||0;
    if (bt !== at) return bt - at;
    return (b.est.updraft_ms||0) - (a.est.updraft_ms||0);
  })[0];
}
function pickPeakXcSlot(flyable) {
  if (!flyable.length) return null;
  return flyable.slice().sort((a,b) => {
    const dx = (b.est.xc_downwind_km||0) - (a.est.xc_downwind_km||0);
    if (dx !== 0) return dx;
    return (a.est.local_time || '').localeCompare(b.est.local_time || '');
  })[0];
}
function xcLabel(km, time, approx) {
  if (km == null) return null;
  const n = Math.round(km);
  const prefix = approx ? '~' : '';
  return time ? `${prefix}${n} km @ ${time}` : `${prefix}${n} km`;
}
function hourRange(hours) {
  if (!hours.length) return '';
  if (hours.length === 1) return hours[0];
  return `${hours[0]}–${hours[hours.length-1]}`;
}
function formatDateRanges(dates) {
  if (!dates.length) return '';
  const runs = [];
  dates.forEach(d => {
    const prev = runs.length ? runs[runs.length-1] : null;
    if (prev) {
      const [y,m,da] = prev[prev.length-1].split('-').map(Number);
      const next = new Date(Date.UTC(y, m-1, da, 4, 0, 0));
      next.setUTCDate(next.getUTCDate() + 1);
      const expect = next.toISOString().slice(0,10);
      if (expect === d) { prev.push(d); return; }
    }
    runs.push([d]);
  });
  return runs.map(r => r.length === 1 ? shortDayMonth(r[0]) : `${shortDayMonth(r[0])}–${shortDayMonth(r[r.length-1])}`).join(', ');
}
function missingInSpan(dates) {
  if (dates.length < 2) return [];
  const missing = [];
  const start = dayDate(dates[0]);
  const end = dayDate(dates[dates.length-1]);
  for (let t = new Date(start); t < end; t.setUTCDate(t.getUTCDate() + 1)) {
    const iso = t.toISOString().slice(0,10);
    if (!dates.includes(iso)) missing.push(iso);
  }
  return missing;
}

function collectDays(forecast) {
  const map = hourMap(forecast);
  const site = siteByKey();
  const byDay = {};
  Object.keys(map).sort().forEach(t => {
    const hh = parseInt(t.slice(11,13), 10);
    if (!TARGET_HOURS.includes(hh)) return;
    const day = t.slice(0,10);
    (byDay[day] = byDay[day] || []).push({ time: t, hour: map[t], hh });
  });
  return Object.keys(byDay).sort().map((day, di) => {
    const slots = byDay[day].map(({time, hour, hh}) => {
      const est = estimateHour(hour, hh);
      est.time = time;
      est.slot_key = time.slice(0,16);
      est.local_time = time.slice(11,16);
      return { est, site: site[est.slot_key] };
    });
    const flyable = slots.filter(s => s.est.launchable);
    const launchableHours = flyable.map(s => s.est.local_time);
    // Best slot and day-level Magic/XC are taken only from launchable slots (ours).
    const peakMagic = flyable.length ? Math.max(0, ...flyable.map(s => s.est.magic_pct || 0)) : 0;
    const xcSlot = pickPeakXcSlot(flyable);
    const peakXc = xcSlot && xcSlot.est.xc_downwind_km != null ? xcSlot.est.xc_downwind_km : null;
    const peakXcTime = xcSlot ? xcSlot.est.local_time : null;
    const best = pickBestSlot(flyable);
    return { day, di, slots, flyable, launchableHours, peakMagic, peakXc, peakXcTime, best };
  });
}

function renderFlyableSummary(days) {
  const box = document.getElementById('flyable-summary');

    }
    const hours = hourRange(d.launchableHours);
    const bestTime = d.best && d.best.est.local_time;
    const bestMagic = d.best ? (d.best.est.magic_pct ?? 0) : 0;
    const xc = xcLabel(d.peakXc, d.peakXcTime, true);
    return `<a class="fly-chip good" href="#day-${d.day}"><span class="fly-day">${shortDay(d.day)}</span><span class="fly-sep">·</span><span class="fly-hours">${hours}</span><span class="fly-sep">·</span><span class="fly-best">Best Magic ${bestMagic}% at ${bestTime}</span>${xc ? `<span class="fly-sep">·</span><span class="fly-xc">XC ${xc}</span>` : ''}</a>`;

function renderSiteCoverage(days) {
  const el = document.getElementById('soaring-forecast-info');
  if (!el) return;
  const intro = 'Slots are 11:00, 13:00, 15:00 and 17:00 AWST. \u201cSite\u201d values are from the last Muppet Forecast scrape when that slot exists.';
  const siteDays = [...new Set((SITE.slots || []).map(s => s.local_date || (s.slot_key || '').slice(0,10)).filter(Boolean))].sort();
  const ourDays = days.map(d => d.day);
  let coverage;
  if (!siteDays.length) {
    coverage = 'No original-site snapshot is embedded, so only our estimates are shown.';
  } else {
    const skipped = missingInSpan(siteDays);
    const beyond = ourDays.filter(d => d > siteDays[siteDays.length-1]);
    const cache = (META && META.site_cache_generated) ? ` (cache generated ${META.site_cache_generated} AWST)` : '';
    coverage = `The original site${cache} covers ${formatDateRanges(siteDays)}.`;
    if (skipped.length) coverage += ` It skipped ${formatDateRanges(skipped)}.`;
    if (beyond.length) coverage += ` Our GFS forecast also runs through ${shortDayMonth(beyond[beyond.length-1])}, past the site\u2019s horizon.`;
    coverage += ' Those days show our estimates only.';
  }
  el.innerHTML = infoButton('About the soaring-hour forecast', intro + '\n\n' + 'Paragliding only: launch window, Magic % and XC are tuned for paragliders, not hang gliders.' + '\n\n' + coverage);
}

        ${pair('Thermal quality', est.thermal_quality_pct+'%', s && s.thermal_quality_pct != null ? s.thermal_quality_pct+'%' : null)}
        ${pair('Magic %', est.magic_pct+'%', s && s.magic_pct != null ? s.magic_pct+'%' : null)}
        ${pair('Downwind XC', est.xc_downwind_km != null ? est.xc_downwind_km+' km' : '–', s && s.xc_downwind_km != null ? s.xc_downwind_km+' km' : null)}

function setupInfoButtons(root) {
  if (setupInfoButtons._bound) return root || document;
  const MARGIN = 8;
  const GAP = 8;
  let ignoreUntil = 0;

  const popFor = (wrap) => {
    const btn = wrap.querySelector('.info-btn');
    const id = btn && btn.getAttribute('aria-controls');
    if (id) {
      const el = document.getElementById(id);
      if (el) return el;
    }
    return wrap._pop || wrap.querySelector('.info-pop') || null;
  };

  const closeOne = (wrap) => {
    wrap.classList.remove('is-open');
    const btn = wrap.querySelector('.info-btn');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    const pop = popFor(wrap);
    if (!pop) return;
    pop.hidden = true;
    pop.classList.remove('is-visible', 'info-pop-above');
    pop.style.display = 'none';
    if (pop.parentElement !== wrap) wrap.appendChild(pop);
  };

  const closeAll = (except) => {
    document.querySelectorAll('.info.is-open').forEach(el => {
      if (el !== except) closeOne(el);
    });
  };

  const placePop = (wrap) => {
    const btn = wrap.querySelector('.info-btn');
    const pop = popFor(wrap);
    if (!btn || !pop) return;
    wrap._pop = pop;
    if (pop.parentElement !== document.body) document.body.appendChild(pop);
    pop.hidden = false;
    pop.classList.add('is-visible');
    pop.style.display = 'block';
    pop.style.position = 'fixed';
    pop.style.zIndex = '10000';
    pop.style.right = 'auto';
    pop.style.bottom = 'auto';
    pop.style.maxWidth = `${Math.max(0, window.innerWidth - MARGIN * 2)}px`;
    pop.style.left = `${MARGIN}px`;
    pop.style.top = `${MARGIN}px`;
    const br = btn.getBoundingClientRect();
    const pw = pop.offsetWidth;
    const ph = pop.offsetHeight;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const spaceBelow = vh - br.bottom - MARGIN;
    const spaceAbove = br.top - MARGIN;
    const placeAbove = (ph + GAP > spaceBelow) && (spaceAbove > spaceBelow);
    pop.classList.toggle('info-pop-above', placeAbove);
    let top = placeAbove ? (br.top - GAP - ph) : (br.bottom + GAP);
    if (top < MARGIN) top = MARGIN;
    if (top + ph > vh - MARGIN) top = Math.max(MARGIN, vh - MARGIN - ph);
    let left = br.left;
    if (left + pw > vw - MARGIN) left = vw - MARGIN - pw;
    if (left < MARGIN) left = MARGIN;
    pop.style.top = `${Math.round(top)}px`;
    pop.style.left = `${Math.round(left)}px`;
    const caret = br.left + br.width / 2 - left - 5;
    pop.style.setProperty('--caret-left', `${Math.max(8, Math.min(pw - 18, caret))}px`);
  };

  const toggleFromBtn = (btn) => {
    const wrap = btn.closest('.info');
    if (!wrap) return;
    const willOpen = !wrap.classList.contains('is-open');
    closeAll();
    if (willOpen) {
      wrap.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
      placePop(wrap);
      requestAnimationFrame(() => placePop(wrap));
    }
  };

  const onActivate = (e, isPrimary) => {
    const now = Date.now();
    const btn = e.target.closest && e.target.closest('.info-btn');
    const inPop = e.target.closest && e.target.closest('.info-pop');
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      if (!isPrimary && now < ignoreUntil) return;
      ignoreUntil = now + 400;
      toggleFromBtn(btn);
      return;
    }
    if (inPop) return;
    if (!isPrimary && now < ignoreUntil) return;
    closeAll();
  };

  document.addEventListener('pointerup', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    onActivate(e, true);
  }, true);
  document.addEventListener('click', (e) => {
    onActivate(e, false);
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAll();
  });
  window.addEventListener('resize', () => closeAll());
  document.addEventListener('scroll', () => closeAll(), true);
  setupInfoButtons._bound = true;
  return root || document;
}
function infoButton(ariaLabel, text) {
  infoButton._seq = (infoButton._seq || 0) + 1;
  const id = 'info-pop-' + infoButton._seq;
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return `<span class="info"><button type="button" class="info-btn" aria-label="${esc(ariaLabel)}" aria-expanded="false" aria-controls="${id}">i</button><span id="${id}" class="info-pop" role="tooltip" hidden>${esc(text)}</span></span>`;
}


function formulaInfoText() {
  const v = (FORMULAS && FORMULAS.version) || 'unknown';
  const title = (FORMULAS && FORMULAS.title) || 'Mount Bakewell estimator';
  if (v === 'v0.2.0') {
    return 'Formula v0.2.0 is the current Mount Bakewell estimator. Wind at launch is a 50/50 blend of GFS 10 m and 80 m wind, to better represent the exposed 432 m ridge. Gusts are estimated so they are never below the launch wind, combining the GFS gust field with a convective and mechanical term. Thermal height, updraft, Magic %, XC and turbulence still follow the v0.1.0 baseline fitted to the Muppet Forecast site.';
  }
  const logs = (FORMULAS && FORMULAS.changelog) || [];
  const mine = logs.find(c => c.version === v) || logs[0];
  let msg = `This page is running formula ${v}`;
  if (title) msg += `: ${title}`;
  msg += '.';
  if (mine && mine.notes) {
    const notes = String(mine.notes);
    msg += ' ' + (notes.length > 400 ? notes.slice(0, 397) + '\u2026' : notes);
  }
  return msg;
}

function formatPerthStamp(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  return d.toLocaleString('en-AU', { timeZone: TZ }) + ' AWST';
}

async function main() {
  fillStaticInfoButtons();
  const status = document.getElementById('status');
  const obsPromise = loadObservations();
  try {
    const [{forecast, warnings}, obs] = await Promise.all([loadLiveForecast(), obsPromise]);
    let msg = `Updated • ${new Date().toLocaleString('en-AU', {timeZone: TZ})} AWST`;
    if (warnings && warnings.length) msg += ` • some pressure-level groups fell back or failed`;
    status.textContent = msg;
    status.className = 'status success';
    renderNow(forecast, obs);
    renderForecasts(forecast);
  } catch (err) {
    const obs = await obsPromise.catch(() => ({ missing: true }));
    if (LAST_OM && LAST_OM.hourly && LAST_OM.hourly.time) {
      status.textContent = `Live Open-Meteo failed (${err.message}). Showing the last snapshot embedded in this file.`;
      status.className = 'status error';
      renderNow(LAST_OM, obs);
      renderForecasts(LAST_OM);
    } else {
      status.textContent = `Live data unavailable (${err.message}). Open-Meteo free tier has daily limits, and no embedded snapshot was present.`;
      status.className = 'status error';
      renderNow(null, obs);
    }
  }
}
setupInfoButtons();
main();
</script>
</body>
</html>
